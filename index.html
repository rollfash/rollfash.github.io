  "@context": "https://schema.org",

<body>

<header class="hub-header">
  <h1>משחקי מילים בעברית</h1>
  <p class="sub">משחק חדש בכל יום. בלי הרשמה, בלי הורדה.</p>
</header>

<main class="games">

  <a class="game-card" href="wordle/">
    <div class="tiles" aria-hidden="true">
      <span class="t correct">ע</span><span class="t">ב</span><span class="t present">ר</span><span class="t">ד</span><span class="t correct">ל</span>
    </div>
    <h2>עברדל</h2>
    <p>נחשו את מילת היום בת חמש האותיות בשישה נסיונות.</p>
    <span class="play">שחקו ←</span>
  </a>

  <div class="game-card soon" aria-disabled="true">
    <div class="tiles" aria-hidden="true">
      <span class="t img">🎵</span>
    </div>
    <h2>השיר היומי</h2>
    <p>תמונה אחת, שיר אחד. סדרו את האותיות ונחשו איזה שיר מסתתר בתמונה.</p>
    <span class="play">בקרוב</span>
  </div>

</main>

<footer class="hub-footer">
  <p>כל המשחקים רצים בדפדפן בלבד — שום מידע לא נשמר מחוץ למכשיר שלכם.</p>
</footer>

</body>
